# VehiGuard settings (non-secret). Secrets and ALERT_MODE live in .env.
# Keys and defaults follow docs/architecture.md §9.

pipeline:
  frame_fps: 5                # processing frame rate per camera
  plate_vote_frames: 10       # frames in the voting window
  ocr_conf_gate: 0.70         # minimum mean OCR confidence to accept a plate
  plate_timeout_s: 10         # time before NO_PLATE

performance:
  # CPU cores for YOLO detection and for PaddleOCR (this laptop has 8).
  # Keeping them separate stops the two from slowing each other down.
  detector_threads: 4
  ocr_threads: 3

detection:
  vehicle_model: yolov8n.pt     # pre-trained COCO model (car, motorcycle, bus, truck)
  vehicle_conf: 0.35
  vehicle_imgsz: 480            # 640 is slightly more accurate but slower on a CPU
  vehicle_every: 2              # detect vehicles every Nth frame (plates: every frame)
  # Fine-tuned on Indian plates (task 2.4): plates found 82% -> 87% on test photos.
  # Nepal baseline (D07): hf://krishnamishra8848/Nepal-Vehicle-License-Plate-Detection/last.pt
  plate_model: models/plate_detector.pt
  plate_conf: 0.10              # trained model is less confident: 0.10 reads 57% vs 53% at 0.25
  plate_imgsz: 640

ocr:
  # Tried in this order. paddle_rec = fast PaddleOCR recognition only (live
  # default); paddleocr = full PaddleOCR; easyocr = fallback engine.
  engines: [paddle_rec, paddleocr, easyocr]
  variants: [gray, full, binary]  # preprocessed versions of the crop to try
  # Live pipeline: fast read every time, full fallback every Nth read per vehicle
  thorough_every: 4

matching:
  fuzzy_max_edit_distance: 1  # edit distance for POSSIBLE_MATCH review items
  flag_unregistered: false    # alert on plates not in the registry (decision D-01)

sightings:
  sighting_cooldown_s: 30     # de-duplication window at one camera

clone_detection:
  clone_window_h: 24          # how far back to look for earlier sightings
  max_plausible_speed_kmh: 120  # impossible-journey speed limit (decision D-02)
  min_clone_distance_km: 1    # ignore camera pairs closer than this
  time_tolerance_s: 5         # added to the time gap to absorb stream delay

alerts:
  alert_cooldown_s: 900       # alert de-duplication window
  outbox_max_attempts: 5      # delivery attempts

evidence:
  evidence_retention_days: 30 # purge window (open cases excepted)
