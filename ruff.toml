# The project runs on Python 3.11 (see docs/tech_stack.md), so ruff must not
# suggest syntax from newer versions (e.g. "def f[T]()" or "class A[T]:").
target-version = "py311"

# FastAPI's normal pattern is Depends(...) and Query(...) in argument defaults
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.api.deps.require"]
