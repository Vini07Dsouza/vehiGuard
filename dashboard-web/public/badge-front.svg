<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" width="200" height="232">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece7d8"/>
      <stop offset="0.42" stop-color="#9d9786"/>
      <stop offset="0.7" stop-color="#cbc4b0"/>
      <stop offset="1" stop-color="#6c675a"/>
    </linearGradient>
    <linearGradient id="inset" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7b7566"/>
      <stop offset="0.5" stop-color="#b9b2a0"/>
      <stop offset="1" stop-color="#8d8777"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e8aa"/>
      <stop offset="1" stop-color="#b6862b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58533f"/>
      <stop offset="1" stop-color="#2b2820"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="wing" d="M100 30 C84 14 52 10 14 30 C30 32 38 40 44 54 C58 44 76 40 100 46 Z"/>
    <path id="shield" d="M100 44 C132 44 160 50 178 62 L178 130 C178 178 142 210 100 228 C58 210 22 178 22 130 L22 62 C40 50 68 44 100 44 Z"/>
    <path id="arc" d="M40 172 Q100 194 160 172" fill="none"/>
  </defs>

  <!-- wings -->
  <use href="#wing" fill="url(#metal)" stroke="#5b564a" stroke-width="3" stroke-linejoin="round"/>
  <use href="#wing" fill="url(#metal)" stroke="#5b564a" stroke-width="3" stroke-linejoin="round" transform="translate(200 0) scale(-1 1)"/>
  <g fill="none" stroke="#6c675a" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M26 33 C40 36 48 42 52 50"/>
    <path d="M40 24 C52 28 62 34 68 44"/>
    <path d="M174 33 C160 36 152 42 148 50"/>
    <path d="M160 24 C148 28 138 34 132 44"/>
  </g>
  <circle cx="100" cy="28" r="8" fill="url(#metal)" stroke="#5b564a" stroke-width="2.5"/>

  <!-- shield -->
  <use href="#shield" fill="url(#metal)" stroke="#5b564a" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#shield" fill="url(#inset)" stroke="#5b564a" stroke-width="2" transform="translate(100 136) scale(0.88) translate(-100 -136)"/>
  <path d="M100 48 C70 48 42 54 24 66 L24 116 C62 96 92 76 100 48 Z" fill="url(#gloss)" opacity="0.55"/>

  <!-- star in a ring -->
  <circle cx="100" cy="122" r="47" fill="none" stroke="#5b564a" stroke-width="3"/>
  <circle cx="100" cy="122" r="41" fill="none" stroke="#e7e1cf" stroke-width="1.6" opacity="0.8"/>
  <polygon points="100,88 108.2,110.7 132.3,111.5 113.3,126.3 120,149.5 100,136 80,149.5 86.7,126.3 67.7,111.5 91.8,110.7" fill="url(#gold)" stroke="#7a5a18" stroke-width="2" stroke-linejoin="round"/>
  <g fill="url(#gold)" stroke="#7a5a18" stroke-width="1.5">
    <circle cx="100" cy="88" r="4.2"/>
    <circle cx="132.3" cy="111.5" r="4.2"/>
    <circle cx="120" cy="149.5" r="4.2"/>
    <circle cx="80" cy="149.5" r="4.2"/>
    <circle cx="67.7" cy="111.5" r="4.2"/>
  </g>

  <!-- banner -->
  <path d="M30 150 Q100 172 170 150 L170 182 Q100 204 30 182 Z" fill="url(#ribbon)" stroke="#d9d2bd" stroke-width="2.5" stroke-linejoin="round"/>
  <use href="#arc"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3" fill="#efe7cc">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">POLICE</textPath>
  </text>
</svg>
